<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org/dtd/xhtml1-strict-thymeleaf-4.dtd">

<div th:fragment="app-error" th:remove="${#lists.isEmpty(errors)}? tag : none" class="error-container">
    <div th:if="${not #lists.isEmpty(errors)}" th:remove="tag">
        <p th:each="error : ${errors.messages}" th:text="${error.message}"></p>
    </div>
</div>
</html>
